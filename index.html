<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SocialClip — Art · Media · Digital</title>

<meta
  name="description"
  content="SocialClip — Art, Media, Digital. Webseiten, Design, Social Media, Foto, Video, Marketing und digitale Lösungen."
>

<style>

/* =========================================================
   SOCIALCLIP — ART · MEDIA · DIGITAL
   ========================================================= */

:root{
  --bg:#050505;
  --bg2:#090909;
  --white:#f5f5f2;
  --muted:#999;
  --line:rgba(255,255,255,.11);
  --soft:rgba(255,255,255,.055);
  --accent:#ffffff;
  --max:1400px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  background:#050505;
}

body{
  background:var(--bg);
  color:var(--white);
  font-family:Arial, Helvetica, sans-serif;
  overflow-x:hidden;
}

body.locked{
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
textarea{
  font:inherit;
}

img{
  max-width:100%;
  display:block;
}

/* =========================================================
   GLOBAL ATMOSPHERE
   ========================================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:900;
  opacity:.035;
  background-image:
    radial-gradient(circle at 20% 20%, #fff 0 1px, transparent 1px),
    radial-gradient(circle at 80% 70%, #fff 0 1px, transparent 1px);
  background-size:7px 7px,11px 11px;
  mix-blend-mode:screen;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:899;
  background:
    linear-gradient(
      rgba(255,255,255,.015) 1px,
      transparent 1px
    );
  background-size:100% 5px;
  opacity:.16;
}

/* =========================================================
   INTRO
   ========================================================= */

#intro{
  position:fixed;
  inset:0;
  z-index:5000;
  background:#030303;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:auto;
  transition:
    opacity 1.4s ease,
    visibility 1.4s ease;
}

#intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-bg{
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,.10),
      transparent 25%
    ),
    radial-gradient(
      circle at 20% 20%,
      rgba(255,255,255,.035),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(255,255,255,.025),
      transparent 30%
    );
  animation:introBreath 9s ease-in-out infinite alternate;
}

@keyframes introBreath{
  from{
    transform:scale(1);
  }
  to{
    transform:scale(1.08) rotate(.5deg);
  }
}

.intro-grid{
  position:absolute;
  inset:-10%;
  background:
    linear-gradient(
      rgba(255,255,255,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.045) 1px,
      transparent 1px
    );
  background-size:90px 90px;
  transform:
    perspective(700px)
    rotateX(58deg)
    translateY(30%);
  transform-origin:center bottom;
  opacity:.25;
  animation:gridMove 14s linear infinite;
}

@keyframes gridMove{
  from{
    background-position:0 0;
  }
  to{
    background-position:0 90px;
  }
}

.intro-light{
  position:absolute;
  width:45vw;
  height:45vw;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(255,255,255,.10),
    transparent 65%
  );
  filter:blur(40px);
  animation:lightMove 10s ease-in-out infinite alternate;
}

@keyframes lightMove{
  0%{
    transform:translate(-25%,-10%);
  }
  100%{
    transform:translate(25%,15%);
  }
}

.intro-lines{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.intro-lines span{
  position:absolute;
  width:1px;
  height:100%;
  background:linear-gradient(
    transparent,
    rgba(255,255,255,.15),
    transparent
  );
  animation:lineMove 5s linear infinite;
}

.intro-lines span:nth-child(1){
  left:15%;
}

.intro-lines span:nth-child(2){
  left:38%;
  animation-delay:1.5s;
}

.intro-lines span:nth-child(3){
  left:67%;
  animation-delay:2.7s;
}

.intro-lines span:nth-child(4){
  left:87%;
  animation-delay:3.6s;
}

@keyframes lineMove{
  from{
    transform:translateY(-100%);
  }
  to{
    transform:translateY(100%);
  }
}

.intro-content{
  position:relative;
  z-index:5;
  width:min(1100px,90vw);
  text-align:center;
}

.intro-step{
  position:absolute;
  left:50%;
  top:50%;
  width:100%;
  transform:
    translate(-50%,-50%)
    scale(.96);
  opacity:0;
  filter:blur(12px);
  transition:
    opacity 1s ease,
    transform 1.2s cubic-bezier(.2,.8,.2,1),
    filter 1s ease;
  pointer-events:none;
}

.intro-step.active{
  opacity:1;
  transform:
    translate(-50%,-50%)
    scale(1);
  filter:blur(0);
}

.intro-step small{
  display:block;
  margin-bottom:22px;
  font-size:10px;
  letter-spacing:.45em;
  color:#777;
  text-transform:uppercase;
}

.intro-word{
  font-size:
    clamp(45px,9vw,150px);
  line-height:.84;
  letter-spacing:-.07em;
  font-weight:800;
}

.intro-word span{
  display:block;
}

.intro-word .dim{
  color:#555;
}

.intro-brand{
  font-size:
    clamp(28px,5vw,75px);
  letter-spacing:.08em;
  font-weight:700;
}

.intro-brand-sub{
  margin-top:18px;
  color:#777;
  letter-spacing:.45em;
  font-size:10px;
}

.intro-final{
  pointer-events:none;
}

.intro-final.active{
  pointer-events:auto;
}

.intro-final h1{
  font-size:
    clamp(38px,7vw,105px);
  line-height:.95;
  letter-spacing:-.055em;
  margin-bottom:24px;
}

.intro-final p{
  max-width:650px;
  margin:0 auto 38px;
  color:#999;
  font-size:
    clamp(15px,2vw,19px);
  line-height:1.7;
}

.enter-button{
  appearance:none;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.035);
  color:#fff;
  padding:18px 28px;
  cursor:pointer;
  letter-spacing:.18em;
  font-size:11px;
  transition:
    background .3s ease,
    border-color .3s ease,
    transform .3s ease;
  position:relative;
  z-index:20;
}

.enter-button:hover{
  background:#fff;
  color:#050505;
  border-color:#fff;
  transform:translateY(-3px);
}

/* =========================================================
   TRANSITION
   ========================================================= */

#transition{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:4500;
  transform:scaleY(0);
  transform-origin:bottom;
  pointer-events:none;
}

#transition.go{
  animation:transitionGo 1.5s cubic-bezier(.77,0,.18,1);
}

@keyframes transitionGo{
  0%{
    transform:scaleY(0);
  }
  45%{
    transform:scaleY(1);
  }
  100%{
    transform:scaleY(0);
    transform-origin:top;
  }
}

/* =========================================================
   NAV
   ========================================================= */

nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:76px;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5vw;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(5,5,5,.62);
  backdrop-filter:blur(18px);
}

.nav-logo{
  font-size:12px;
  letter-spacing:.25em;
  font-weight:700;
}

.nav-links{
  display:flex;
  gap:28px;
  align-items:center;
}

.nav-links a{
  font-size:10px;
  color:#aaa;
  letter-spacing:.16em;
  transition:color .25s ease;
}

.nav-links a:hover{
  color:#fff;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  padding:
    120px 6vw
    80px;
  overflow:hidden;
}

.hero-grid{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      rgba(255,255,255,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.035) 1px,
      transparent 1px
    );
  background-size:80px 80px;
  mask-image:linear-gradient(
    to bottom,
    black,
    transparent
  );
}

.hero-glow{
  position:absolute;
  width:600px;
  height:600px;
  border-radius:50%;
  right:-180px;
  top:10%;
  background:radial-gradient(
    circle,
    rgba(255,255,255,.08),
    transparent 65%
  );
  filter:blur(30px);
}

.hero-content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:var(--max);
  margin:auto;
}

.hero-kicker{
  color:#777;
  letter-spacing:.35em;
  font-size:10px;
  margin-bottom:28px;
}

.hero h1{
  font-size:
    clamp(60px,12vw,180px);
  line-height:.78;
  letter-spacing:-.075em;
  font-weight:800;
}

.hero h1 span{
  display:block;
}

.hero h1 .outline{
  color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.55);
}

.hero-bottom{
  margin-top:70px;
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:end;
}

.hero-bottom p{
  max-width:520px;
  color:#999;
  line-height:1.7;
  font-size:15px;
}

.scroll-note{
  color:#666;
  font-size:9px;
  letter-spacing:.25em;
  white-space:nowrap;
}

/* =========================================================
   MARQUEE
   ========================================================= */

.marquee{
  overflow:hidden;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:20px 0;
  background:#070707;
}

.marquee-track{
  display:flex;
  width:max-content;
  animation:marquee 28s linear infinite;
}

.marquee-track span{
  font-size:
    clamp(18px,3vw,34px);
  font-weight:700;
  letter-spacing:.08em;
  padding-right:60px;
  white-space:nowrap;
}

.marquee-track .dot{
  color:#555;
}

@keyframes marquee{
  to{
    transform:translateX(-50%);
  }
}

/* =========================================================
   GENERAL SECTION
   ========================================================= */

.section{
  position:relative;
  padding:
    150px 6vw;
  overflow:hidden;
}

.section-inner{
  max-width:var(--max);
  margin:auto;
}

.section-label{
  color:#666;
  font-size:10px;
  letter-spacing:.3em;
  margin-bottom:55px;
}

.section-title{
  font-size:
    clamp(42px,7vw,105px);
  line-height:.9;
  letter-spacing:-.065em;
  max-width:1050px;
}

.section-title .muted{
  color:#444;
}

.section-copy{
  max-width:650px;
  color:#999;
  line-height:1.8;
  margin-top:42px;
  font-size:16px;
}

/* =========================================================
   SCENES
   ========================================================= */

.scene{
  min-height:80vh;
  display:flex;
  align-items:center;
  border-top:1px solid var(--line);
}

.scene:nth-child(even){
  background:#080808;
}

.scene-content{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10vw;
  align-items:center;
}

.scene-number{
  color:#555;
  font-size:11px;
  letter-spacing:.2em;
  margin-bottom:20px;
}

.scene h2{
  font-size:
    clamp(45px,7vw,110px);
  letter-spacing:-.07em;
  line-height:.85;
}

.scene p{
  color:#888;
  line-height:1.8;
  max-width:470px;
}

.scene-visual{
  min-height:450px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  background:
    radial-gradient(
      circle at 30% 30%,
      rgba(255,255,255,.13),
      transparent 22%
    ),
    linear-gradient(
      135deg,
      #181818,
      #050505 55%,
      #111
    );
}

.scene-visual::before{
  content:"";
  position:absolute;
  width:55%;
  height:55%;
  left:20%;
  top:20%;
  border:1px solid rgba(255,255,255,.16);
  transform:rotate(20deg);
  animation:visualRotate 15s linear infinite;
}

.scene-visual::after{
  content:"";
  position:absolute;
  inset:15%;
  border:1px solid rgba(255,255,255,.07);
  transform:rotate(-14deg);
}

@keyframes visualRotate{
  to{
    transform:rotate(380deg);
  }
}

/* =========================================================
   SERVICES
   ========================================================= */

.services{
  border-top:1px solid var(--line);
}

.service-list{
  border-top:1px solid var(--line);
}

.service{
  display:grid;
  grid-template-columns:
    80px 1fr auto;
  gap:30px;
  align-items:center;
  padding:27px 0;
  border-bottom:1px solid var(--line);
  transition:
    padding .35s ease,
    background .35s ease;
  position:relative;
  overflow:hidden;
}

.service::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:0;
  height:100%;
  background:rgba(255,255,255,.04);
  transition:width .4s ease;
}

.service:hover{
  padding-left:20px;
  padding-right:20px;
}

.service:hover::before{
  width:100%;
}

.service-number{
  color:#555;
  font-size:11px;
  position:relative;
}

.service-name{
  font-size:
    clamp(22px,3vw,42px);
  letter-spacing:-.035em;
  position:relative;
}

.service-arrow{
  color:#555;
  font-size:20px;
  position:relative;
  transition:
    color .3s ease,
    transform .3s ease;
}

.service:hover .service-arrow{
  color:#fff;
  transform:translateX(8px);
}

/* =========================================================
   MANIFESTO
   ========================================================= */

.manifesto{
  min-height:90vh;
  display:flex;
  align-items:center;
  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,.055),
      transparent 40%
    );
}

.manifesto h2{
  font-size:
    clamp(48px,9vw,135px);
  line-height:.85;
  letter-spacing:-.075em;
}

.manifesto h2 span{
  display:block;
}

.manifesto h2 .thin{
  font-weight:300;
  color:#777;
}

/* =========================================================
   VISUAL WORLD
   ========================================================= */

.visual-world{
  background:#080808;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.visual-intro{
  display:flex;
  justify-content:space-between;
  gap:50px;
  align-items:end;
  margin-bottom:70px;
}

.visual-intro h2{
  font-size:
    clamp(40px,7vw,100px);
  line-height:.9;
  letter-spacing:-.065em;
}

.visual-intro p{
  max-width:430px;
  color:#777;
  line-height:1.7;
}

.visual-gallery{
  display:grid;
  grid-template-columns:
    1.2fr .8fr 1fr;
  grid-auto-rows:270px;
  gap:14px;
}

.visual-card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  background:#111;
  isolation:isolate;
}

.visual-card:nth-child(1){
  grid-row:span 2;
}

.visual-card:nth-child(4){
  grid-column:span 2;
}

.visual-art{
  position:absolute;
  inset:0;
  transition:
    transform .9s cubic-bezier(.2,.8,.2,1),
    filter .7s ease;
}

.visual-card:hover .visual-art{
  transform:scale(1.06);
  filter:contrast(1.1);
}

.art-design{
  background:
    linear-gradient(
      130deg,
      transparent 25%,
      rgba(255,255,255,.12) 25.2%,
      transparent 25.7%
    ),
    radial-gradient(
      circle at 65% 35%,
      #3a3a3a,
      transparent 18%
    ),
    linear-gradient(
      145deg,
      #222,
      #050505 65%
    );
}

.art-design::before{
  content:"";
  position:absolute;
  width:55%;
  height:120%;
  top:-10%;
  left:22%;
  border:1px solid rgba(255,255,255,.2);
  transform:rotate(26deg);
}

.art-design::after{
  content:"";
  position:absolute;
  width:40%;
  height:40%;
  right:10%;
  bottom:10%;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.18),
      transparent 65%
    );
  filter:blur(10px);
}

.art-social{
  background:
    repeating-linear-gradient(
      45deg,
      #111 0 12px,
      #171717 13px 14px
    );
}

.art-social::before{
  content:"SOCIAL";
  position:absolute;
  left:-5%;
  top:25%;
  font-size:clamp(45px,7vw,110px);
  font-weight:800;
  letter-spacing:-.08em;
  color:rgba(255,255,255,.09);
}

.art-photo{
  background:
    radial-gradient(
      ellipse at 50% 30%,
      #3b3b3b,
      transparent 20%
    ),
    linear-gradient(
      110deg,
      #080808,
      #242424,
      #070707
    );
}

.art-photo::before{
  content:"";
  position:absolute;
  width:45%;
  height:65%;
  left:27%;
  top:18%;
  border:1px solid rgba(255,255,255,.3);
  border-radius:50% 50% 5% 5%;
  transform:rotate(-8deg);
}

.art-photo::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      120deg,
      transparent 40%,
      rgba(255,255,255,.08) 50%,
      transparent 60%
    );
}

.art-web{
  background:
    linear-gradient(
      90deg,
      transparent 49.5%,
      rgba(255,255,255,.18) 50%,
      transparent 50.5%
    ),
    linear-gradient(
      transparent 49.5%,
      rgba(255,255,255,.18) 50%,
      transparent 50.5%
    ),
    radial-gradient(
      circle,
      #292929,
      #060606 70%
    );
  background-size:70px 70px,70px 70px,100% 100%;
}

.art-video{
  background:
    linear-gradient(
      120deg,
      #050505,
      #2a2a2a,
      #080808
    );
}

.art-video::before{
  content:"";
  position:absolute;
  width:180%;
  height:1px;
  left:-40%;
  top:50%;
  background:rgba(255,255,255,.4);
  box-shadow:
    0 -70px 0 rgba(255,255,255,.06),
    0 70px 0 rgba(255,255,255,.06);
  transform:rotate(-18deg);
}

.visual-label{
  position:absolute;
  left:20px;
  bottom:18px;
  z-index:5;
  font-size:9px;
  letter-spacing:.25em;
  color:#aaa;
}

.visual-index{
  position:absolute;
  top:18px;
  right:20px;
  z-index:5;
  color:#666;
  font-size:9px;
}

/* =========================================================
   MAKE IT VISIBLE
   ========================================================= */

.make-visible{
  min-height:95vh;
  display:flex;
  align-items:center;
  position:relative;
}

.make-visible::before{
  content:"";
  position:absolute;
  width:70vw;
  height:70vw;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.07),
      transparent 60%
    );
  filter:blur(40px);
}

.make-visible-content{
  position:relative;
  z-index:2;
  width:100%;
}

.make-visible h2{
  font-size:
    clamp(58px,11vw,165px);
  line-height:.78;
  letter-spacing:-.08em;
}

.make-visible h2 span{
  display:block;
}

.make-visible h2 .outline{
  color:transparent;
  -webkit
