<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SocialClip — Art & Media</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #080807;
      color: #f2eee7;
      font-family: "Inter", sans-serif;
    }

    body {
      overflow: hidden;
    }

    /* =====================================================
       INTRO
    ===================================================== */

    .intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(211, 188, 143, 0.08),
          transparent 32%
        ),
        #080807;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      transition:
        opacity 1.4s cubic-bezier(.77,0,.18,1),
        visibility 1.4s;
    }

    .intro.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* feines Licht */

    .intro-light {
      position: absolute;
      width: 65vw;
      height: 65vw;
      max-width: 850px;
      max-height: 850px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(222, 198, 155, 0.12) 0%,
          rgba(222, 198, 155, 0.045) 25%,
          transparent 68%
        );

      filter: blur(30px);

      animation: lightMove 7s ease-in-out infinite alternate;
    }

    @keyframes lightMove {
      from {
        transform: translate(-8%, -4%) scale(.9);
      }

      to {
        transform: translate(8%, 5%) scale(1.08);
      }
    }

    /* =====================================================
       GEOMETRIC LINES
    ===================================================== */

    .intro-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .55;
    }

    .line {
      position: absolute;
      background: rgba(214, 190, 146, .16);
      transform-origin: center;
    }

    .line-horizontal {
      left: 0;
      right: 0;
      height: 1px;
    }

    .line-horizontal.one {
      top: 36%;
    }

    .line-horizontal.two {
      top: 64%;
    }

    .line-vertical {
      top: 0;
      bottom: 0;
      width: 1px;
    }

    .line-vertical.one {
      left: 34%;
    }

    .line-vertical.two {
      left: 66%;
    }

    /* =====================================================
       CENTER
    ===================================================== */

    .intro-center {
      position: relative;
      z-index: 5;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      animation: introCenter 2s cubic-bezier(.16,1,.3,1) forwards;
    }

    @keyframes introCenter {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .intro-small {
      font-size: 10px;
      letter-spacing: .45em;
      text-transform: uppercase;

      color: rgba(242, 238, 231, .55);

      margin-bottom: 24px;

      opacity: 0;
      animation: fadeUp 1.2s .35s forwards;
    }

    .intro-logo {
      font-family: "Cormorant Garamond", serif;

      font-size: clamp(64px, 12vw, 170px);
      font-weight: 300;

      letter-spacing: .08em;
      line-height: .8;

      color: #eee9df;

      position: relative;

      opacity: 0;
      animation: logoIn 1.8s .65s cubic-bezier(.16,1,.3,1) forwards;
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        letter-spacing: .25em;
        transform: scale(.96);
      }

      to {
        opacity: 1;
        letter-spacing: .08em;
        transform: scale(1);
      }
    }

    .intro-logo::after {
      content: "";

      position: absolute;

      left: 10%;
      right: 10%;
      bottom: -22px;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #d6be92,
          transparent
        );

      transform: scaleX(0);

      animation: lineIn 1.5s 1.4s cubic-bezier(.77,0,.18,1) forwards;
    }

    @keyframes lineIn {
      to {
        transform: scaleX(1);
      }
    }

    .intro-subtitle {
      margin-top: 42px;

      font-size: 11px;
      letter-spacing: .55em;
      text-transform: uppercase;

      color: #cdb78d;

      opacity: 0;

      animation: fadeUp 1.2s 1.45s forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       LOADING INDICATOR
    ===================================================== */

    .intro-bottom {
      position: absolute;
      bottom: 38px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 14px;

      font-size: 9px;
      letter-spacing: .3em;
      text-transform: uppercase;

      color: rgba(242,238,231,.4);

      opacity: 0;

      animation: fadeUp 1s 2s forwards;
    }

    .loading-line {
      width: 80px;
      height: 1px;

      background: rgba(255,255,255,.12);

      overflow: hidden;
    }

    .loading-line span {
      display: block;
      width: 100%;
      height: 100%;

      background: #d6be92;

      transform: translateX(-100%);

      animation: loading 3.4s 1.8s cubic-bezier(.77,0,.18,1) forwards;
    }

    @keyframes loading {
      to {
        transform: translateX(0);
      }
    }

    /* =====================================================
       HOMEPAGE
    ===================================================== */

    .site {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 70% 20%,
          rgba(205, 183, 141, .08),
          transparent 30%
        ),
        #0b0b0a;

      opacity: 0;

      transform: scale(1.03);

      transition:
        opacity 1.5s ease,
        transform 1.8s cubic-bezier(.16,1,.3,1);
    }

    .site.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* =====================================================
       NAVIGATION
    ===================================================== */

    nav {
      position: fixed;
      z-index: 100;

      top: 0;
      left: 0;
      right: 0;

      padding: 30px 5vw;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      letter-spacing: .12em;
    }

    .nav-links {
      display: flex;
      gap: 35px;

      list-style: none;
    }

    .nav-links a {
      color: #f2eee7;
      text-decoration: none;

      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;

      opacity: .7;

      transition: opacity .3s;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: flex-end;

      padding: 0 7vw 9vh;

      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 40%,
          rgba(0,0,0,.75)
        );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 950px;
    }

    .eyebrow {
      color: #cdb78d;

      font-size: 10px;
      letter-spacing: .35em;
      text-transform: uppercase;

      margin-bottom: 25px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;

      font-size: clamp(70px, 11vw, 160px);
      line-height: .82;
      font-weight: 300;

      letter-spacing: -.03em;
    }

    h1 em {
      color: #cdb78d;
      font-weight: 300;
    }

    .hero-description {
      margin-top: 35px;

      max-width: 500px;

      font-size: 14px;
      line-height: 1.8;

      color: rgba(242,238,231,.55);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .intro-logo {
        font-size: 62px;
      }

      .intro-subtitle {
        font-size: 9px;
        letter-spacing: .4em;
      }

      .nav-links {
        display: none;
      }

      nav {
        padding: 24px 25px;
      }

      .hero {
        padding: 0 25px 60px;
      }

      h1 {
        font-size: 70px;
      }

      .hero-description {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       INTRO
  ===================================================== -->

  <div class="intro" id="intro">

    <div class="intro-light"></div>

    <div class="intro-lines">
      <div class="line line-horizontal one"></div>
      <div class="line line-horizontal two"></div>
      <div class="line line-vertical one"></div>
      <div class="line line-vertical two"></div>
    </div>

    <div class="intro-center">

      <div class="intro-small">
        Art & Media
      </div>

      <div class="intro-logo">
        SOCIALCLIP
      </div>

      <div class="intro-subtitle">
        Creative Visuals
      </div>

    </div>

    <div class="intro-bottom">
      <span>Enter</span>

      <div class="loading-line">
        <span></span>
      </div>
    </div>

  </div>


  <!-- =====================================================
       HOMEPAGE
  ===================================================== -->

  <main class="site" id="site">

    <nav>

      <div class="nav-logo">
        SOCIALCLIP
      </div>

      <ul class="nav-links">
        <li><a href="#work">Work</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

    </nav>


    <section class="hero">

      <div class="hero-content">

        <div class="eyebrow">
          SocialClip Art & Media
        </div>

        <h1>
          We create<br>
          <em>visual impact.</em>
        </h1>

        <p class="hero-description">
          Creative visual solutions, digital experiences
          and media concepts for brands that want to
          make an impression.
        </p>

      </div>

    </section>

  </main>


  <script>

    /*
      INTRO START
    */

    window.addEventListener("load", () => {

      const intro = document.getElementById("intro");
      const site = document.getElementById("site");

      /*
        Das Intro läuft ungefähr 5 Sekunden.
      */

      setTimeout(() => {

        intro.classList.add("hide");

        setTimeout(() => {
          site.classList.add("visible");
          document.body.style.overflow = "auto";
        }, 500);

      }, 5000);

    });

  </script>

</body>
</html>
