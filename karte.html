<style>
:root{--bg:#050505;--card:#0d0d0c;--line:#22211f;--white:#f4f1ea;--soft:#99958d;--dim:#62605b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 28px 28px;text-align:center}
.symbol{width:34px;height:auto;display:block;margin:0 auto 22px}
.wordmark{width:170px;height:auto;display:block;margin:0 auto 8px}
.tag{font-size:10px;letter-spacing:.32em;color:var(--soft);margin-bottom:30px}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.role{font-size:13px;color:var(--soft);line-height:1.5;margin-bottom:28px}
.links{display:grid;gap:10px;margin-bottom:24px}
.links a,.links button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--white);font:inherit;font-size:15px;text-decoration:none;text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.links a:hover,.links button:hover,.links a:focus-visible,.links button:focus-visible{border-color:var(--soft);background:#141412;outline:none}
.links svg{width:20px;height:20px;flex:none;stroke:var(--white);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.links span{display:flex;flex-direction:column;min-width:0}
.links small{font-size:11px;letter-spacing:.14em;color:var(--dim);margin-bottom:2px}
.links b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.primary{background:var(--white)!important;color:var(--bg)!important;border-color:var(--white)!important;justify-content:center;font-weight:700!important;letter-spacing:.06em}
.primary svg{stroke:var(--bg)}
.qr-wrap{background:var(--white);border-radius:14px;padding:16px;width:148px;margin:0 auto 10px}
.qr{display:block;width:100%;height:auto}
.hint{font-size:11px;letter-spacing:.14em;color:var(--dim);margin-bottom:24px}
.foot{border-top:1px solid var(--line);padding-top:18px;font-size:11px;letter-spacing:.14em;color:var(--dim)}
.foot a{color:var(--dim);text-decoration:none;margin:0 6px}
.foot a:hover{color:var(--soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--white);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<script>
var URL_KARTE = 'https://socialclip.art/karte';
var vcard = [
  'BEGIN:VCARD','VERSION:3.0',
  'N:Alin;Mircea;;;','FN:Mircea Alin',
  'ORG:SocialClip Art · Media · Digital','TITLE:Inhaber',
  'TEL;TYPE=CELL,VOICE:+4917646188101',

  'X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/socialclip.art/',
  'NOTE:Design · Web · Social Media · Foto & Video · Marketing',
  'END:VCARD'
].join('\r\n');

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

document.getElementById('save').addEventListener('click', function(){
  var blob = new Blob([vcard], {type:'text/vcard;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Mircea-Alin-SocialClip.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
});

document.getElementById('share').addEventListener('click', function(){
  var data = {title:'Mircea Alin | SocialClip', text:'Digitale Visitenkarte von SocialClip', url:URL_KARTE};
  if (navigator.share) { navigator.share(data).catch(function(){}); return; }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(URL_KARTE).then(function(){ toast('Link kopiert'); }, function(){ toast(URL_KARTE); });
  } else { toast(URL_KARTE); }
});
</script>
