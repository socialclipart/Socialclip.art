async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},key,d(C));
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('czpw',pw)}catch(e){}
  if(location.hash)history.replaceState(null,'',location.pathname);
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Wird geöffnet …';
  try{await unlock(document.getElementById('pw').value.trim())}catch(x){err.textContent='Das Passwort stimmt leider nicht.';go.disabled=false;go.textContent='Vorschau öffnen'}});

  if(pw){try{await unlock(pw)}catch(x){}}})();
